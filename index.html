<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Digital Business Card - Krishna Kumar A/L Kandasamy">

    <meta name="theme-color"
          content="#003b70">

    <title>Krishna Kumar | PKFZ</title>

    <style>

        /* ================================
           GENERAL
        ================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #eef3f7;
            color: #172b4d;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }


        /* ================================
           BUSINESS CARD
        ================================= */

        .card {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            border-radius: 24px;
            overflow: hidden;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.15);

            position: relative;
        }


        /* ================================
           HEADER
        ================================= */

        .header {
            background:
                linear-gradient(
                    135deg,
                    #003b70,
                    #0066a1
                );

            color: white;
            padding: 30px 25px 70px;

            position: relative;
            text-align: center;
        }

        .header::after {
            content: "";
            position: absolute;
            bottom: -35px;
            left: 0;

            width: 100%;
            height: 70px;

            background: white;

            border-radius: 50% 50% 0 0;
        }


        /* ================================
           LOGO
        ================================= */

        .logo {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;

            margin-bottom: 8px;
        }

        .logo-subtitle {
            font-size: 11px;
            letter-spacing: 3px;
            opacity: 0.9;
        }


        /* ================================
           PROFILE PHOTO
        ================================= */

        .profile-container {
            position: relative;
            z-index: 5;

            margin-top: -55px;

            display: flex;
            justify-content: center;
        }

        .profile {
            width: 150px;
            height: 150px;

            border-radius: 50%;

            object-fit: cover;

            border: 6px solid white;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.20);

            background: #ddd;
        }


        /* ================================
           PERSONAL INFORMATION
        ================================= */

        .information {
            padding: 20px 25px 10px;
            text-align: center;
        }

        .name {
            font-size: 25px;
            font-weight: 800;
            color: #003b70;

            line-height: 1.25;

            margin-top: 10px;
        }

        .position {
            font-size: 18px;
            font-weight: 600;

            color: #555;

            margin-top: 8px;
        }

        .department {
            display: inline-block;

            margin-top: 8px;

            padding: 6px 14px;

            border-radius: 20px;

            background: #e8f4fb;
            color: #0066a1;

            font-size: 13px;
            font-weight: 700;

            letter-spacing: 1px;
        }


        /* ================================
           CONTACT INFORMATION
        ================================= */

        .contacts {
            padding: 20px 25px 5px;
        }

        .contact-item {
            display: flex;
            align-items: center;

            gap: 15px;

            padding: 13px 0;

            border-bottom: 1px solid #eeeeee;
        }

        .contact-item:last-child {
            border-bottom: none;
        }

        .icon {
            width: 45px;
            height: 45px;

            flex-shrink: 0;

            border-radius: 50%;

            background: #003b70;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 20px;
        }

        .contact-text {
            text-align: left;
            overflow: hidden;
        }

        .contact-label {
            display: block;

            font-size: 11px;

            color: #888;

            margin-bottom: 3px;

            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .contact-value {
            font-size: 15px;

            font-weight: 600;

            color: #17365d;

            word-break: break-word;
        }


        /* ================================
           ACTION BUTTONS
        ================================= */

        .buttons {
            padding: 20px 25px;

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;
        }

        .button {
            text-decoration: none;

            display: flex;

            justify-content: center;
            align-items: center;

            gap: 8px;

            padding: 13px 10px;

            border-radius: 12px;

            font-size: 14px;

            font-weight: 700;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .call {
            background: #003b70;
            color: white;
        }

        .whatsapp {
            background: #25D366;
            color: white;
        }

        .email {
            background: #e8f4fb;
            color: #003b70;
        }

        .save {
            background: #172b4d;
            color: white;
        }


        /* ================================
           FOOTER
        ================================= */

        .footer {
            background: #003b70;

            color: white;

            text-align: center;

            padding: 18px 15px;

            font-size: 11px;

            letter-spacing: 1px;
        }

        .footer strong {
            display: block;

            font-size: 13px;

            margin-bottom: 5px;
        }

        .footer span {
            opacity: 0.75;
        }


        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 400px) {

            body {
                padding: 10px;
            }

            .card {
                border-radius: 18px;
            }

            .name {
                font-size: 21px;
            }

            .position {
                font-size: 16px;
            }

            .profile {
                width: 130px;
                height: 130px;
            }

            .buttons {
                grid-template-columns: 1fr;
            }
        }

    </style>
</head>


<body>

            <!-- DEPARTMENT -->
            <div class="contact-item">

        <!-- BUTTONS -->

            <a

        </div>


        <!-- FOOTER -->
        <div class="footer">

            <strong>
                PEOPLE | PARTNERSHIPS | PROGRESS
            </strong>

            <span>
                Port Klang Free Zone
            </span>

        </div>

    </div>

</body>

</html>
